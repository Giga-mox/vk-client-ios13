name: Build iOS 13 VK Client IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.2.app
          fi
          xcodebuild -version

      - name: Build Archive (Without Signing)
        run: |
          mkdir -p build
          xcodebuild clean archive \
            -project VKClient.xcodeproj \
            -scheme VKClient \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/VKClient.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "build/VKClient.xcarchive/Products/Applications/VKClient.app" Payload/
          zip -r VKClient-iOS13.ipa Payload
          ls -lh VKClient-iOS13.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VKClient-iOS13-ipa
          path: VKClient-iOS13.ipa
          retention-days: 30
