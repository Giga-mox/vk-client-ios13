name: Build iOS 13 VK Client IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.2.app
          fi
          xcodebuild -version

      - name: Prepare Swift Files
        run: |
          mkdir -p VKClient
          # Автоматически находим и собираем все .swift файлы и Info.plist в VKClient/
          find . -name "*.swift" -not -path "./build/*" -exec cp {} VKClient/ \; 2>/dev/null || true
          find . -name "Info.plist" -not -path "./build/*" -exec cp {} VKClient/ \; 2>/dev/null || true
          echo "Files in VKClient:"
          ls -la VKClient/

      - name: Compile App (Without Signing)
        run: |
          mkdir -p build/derivedData
          xcodebuild build \
            -project VKClient.xcodeproj \
            -scheme VKClient \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/derivedData -name "VKClient.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: VKClient.app not found in build directory!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r VKClient-iOS13.ipa Payload
          ls -lh VKClient-iOS13.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VKClient-iOS13-ipa
          path: VKClient-iOS13.ipa
          retention-days: 30
